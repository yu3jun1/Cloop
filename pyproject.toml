[project]
name = "clarity-loop"
version = "0.1.0"
description = "RRT ensemble world models and receding-horizon evaluation for longitudinal medical research"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["torch", "numpy", "PyYAML"]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
cloop = "cloop.v1.cli:main"

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

